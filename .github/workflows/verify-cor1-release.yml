name: Verify published COR1 cubes
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'data-cubes-20080111-14-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-cubes-20080111-14-v1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 matplotlib==3.10.8 Pillow
      - name: Download the public release assets and check SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download data-cubes-20080111-14-v1 --dir assets
          (cd assets && sha256sum --check checksums.sha256)
      - name: Compare frozen analyses against archived results
        run: |
          python analysis/reproduction/replay.py assets ../cor1-validation --all
          python analysis/reproduction/pair_counts.py data/spatial_expanding_pair_null.csv assets/pds_20080113_two_event_representation_pair_null.csv
          python analysis/reproduction/width_aeff.py assets ../width-replay
